name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # QtGui needs libEGL to load during PyInstaller's analysis; the runner image may lack it
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: |
          python tests/test_index.py
          python tests/test_tools.py
          python tests/test_agent.py
          python tests/test_gemini.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build
        run: python build.py

      # Single self-contained file to hand out: CSV Viewer.exe on Windows, a tar.gz with csv-viewer on Linux
      - name: Build single file
        run: python build.py --onefile

      - uses: actions/upload-artifact@v4
        with:
          name: CSV-Viewer-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
